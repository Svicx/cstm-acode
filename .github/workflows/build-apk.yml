name: Build APK

on:
  workflow_dispatch:          # puoi lanciarlo manualmente
  push:
    branches: [ main ]        # oppure rimuovi questa parte se non vuoi build automatici

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (con submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies + Cordova
        run: |
          npm install
          npm install -g cordova
          npm run setup

      - name: Build debug APK (paid + normal)
        run: |
          node utils/storage_manager.mjs y
          npm run build paid dev apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acode-debug-${{ github.sha }}
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error